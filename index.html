<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&display=swap" />
    <title>Search Statistics</title>
  </head>
  <body>
    <!-- Local Development Configuration - Only for testing -->
    <!-- <script src="/local-config.js"></script> -->

    <script>
      // filterRenderStat: un contenedor por item con id = item.render
      // (replica lo que PHP renderiza en producción)
      (window.filterRenderStat || []).forEach(function (item) {
        if (!item.render) return;
        var div = document.createElement("div");
        div.id = item.render;
        document.body.appendChild(div);
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
